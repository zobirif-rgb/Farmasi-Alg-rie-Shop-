<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الطلبيات - فارماسي الجزائر</title>
<link rel="icon" href="images/brand/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f6f8;--card:#fff;--ink:#1f2540;--mute:#6b7088;--pink:#e8336d;--soft:#fdeef3;--line:#eceaf0;--green:#25d366}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:18px}
header h1 small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.hb{display:flex;gap:6px}
.ib{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.login{max-width:360px;margin:60px auto;background:#fff;border-radius:18px;padding:24px 20px;box-shadow:0 6px 20px rgba(31,37,64,.08);text-align:center}
.login h2{margin:0 0 6px}.login p{color:var(--mute);margin:0 0 14px;font-size:14px}
.login input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:20px;text-align:center;letter-spacing:.3em;direction:ltr}
.login button,.pbtn{width:100%;margin-top:12px;border:0;background:var(--pink);color:#fff;font:inherit;font-weight:800;padding:13px;border-radius:10px;cursor:pointer}
.err{color:#c0152f;font-size:13px;min-height:18px;margin:8px 0 0}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.tabs b{font-weight:800;margin-inline-start:4px;opacity:.85}
.meta{color:var(--mute);font-size:12px;margin:0 0 10px}
.o{background:#fff;border-radius:16px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(31,37,64,.06);border-inline-start:4px solid var(--line)}
.o.s-new{border-inline-start-color:var(--pink)}.o.s-confirmed{border-inline-start-color:#f5a623}.o.s-shipped{border-inline-start-color:#3b82f6}.o.s-delivered{border-inline-start-color:var(--green)}.o.s-cancelled{border-inline-start-color:#9aa0b4;opacity:.75}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ref{direction:ltr;font-weight:800;font-size:13px;color:var(--mute)}
.when{font-size:12px;color:var(--mute)}
.pr{font-weight:800;font-size:15px;margin:2px 0}
.row{font-size:14px;margin:2px 0}
.row span{color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a{flex:1;min-width:90px;text-align:center;text-decoration:none;font-weight:700;font-size:14px;border-radius:10px;padding:9px 6px}
.call{background:var(--soft);color:var(--pink)}.wa{background:var(--green);color:#fff}
.acts select{flex:1.3;min-width:120px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.new-badge{background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700}
</style>
</head>
<body>
<header><h1>الطلبيات<small>فارماسي الجزائر</small></h1><div class="hb" id="hb" hidden><button class="ib" id="rf" type="button">تحديث ↻</button><button class="ib" id="lo" type="button">خروج</button></div></header>
<main id="app"></main>
<script>
(function(){
var app=document.getElementById('app'),pin='',all=[],tab='new',timer=null;
var ST=[['new','جديدة'],['confirmed','مأكدة'],['shipped','تبعثت'],['delivered','وصلت'],['cancelled','ملغية']];
function stName(s){for(var i=0;i<ST.length;i++)if(ST[i][0]===s)return ST[i][1];return s}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function api(path,body){return fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{ok:false}})})}
function waNum(p){var d=String(p).replace(/\D/g,'');if(d.indexOf('213')===0)return d;if(d.charAt(0)==='0')d=d.slice(1);return '213'+d}
function when(s){try{return new Date(s).toLocaleString('fr-FR',{timeZone:'Africa/Algiers',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return s}}
function login(msg){
 document.getElementById('hb').hidden=true;clearInterval(timer);
 app.innerHTML='<div class="login"><h2>🔒 الطلبيات</h2><p>اكتب الرمز السري باش تشوف الطلبيات.</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><p class="err" id="le">'+(msg||'')+'</p><button id="go" type="button">دخول</button></div>';
 var i=document.getElementById('pin');i.focus();
 function go(){pin=i.value.trim();if(!pin)return;fetchAll(true)}
 document.getElementById('go').onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};
}
function fetchAll(first){
 api('/api/admin/orders',{pin:pin}).then(function(d){
  if(!d.ok){store('fa_pin',null);login(d.error==='pin'?'الرمز ماشي صحيح.':'ما قدرناش نجيبو الطلبيات. عاود جرب.');return}
  store('fa_pin',pin);all=d.orders||[];document.getElementById('hb').hidden=false;render();
  if(first){clearInterval(timer);timer=setInterval(function(){fetchAll(false)},30000)}
 }).catch(function(){if(first)login('ما كانش الأنترنت ولا مشكل في الموقع.')});
}
function render(){
 var c={all:all.length};ST.forEach(function(s){c[s[0]]=0});all.forEach(function(o){c[o.status]=(c[o.status]||0)+1});
 var h='<div class="tabs">';
 [['new','جديدة']].concat(ST.slice(1)).concat([['all','الكل']]).forEach(function(s){h+='<button type="button" data-t="'+s[0]+'"'+(tab===s[0]?' class="on"':'')+'>'+s[1]+'<b>'+(c[s[0]]||0)+'</b></button>'});
 h+='</div><p class="meta">يتحدث وحدو كل 30 ثانية · آخر تحديث '+new Date().toLocaleTimeString('fr-FR',{timeZone:'Africa/Algiers',hour:'2-digit',minute:'2-digit'})+'</p>';
 var list=all.filter(function(o){return tab==='all'||o.status===tab});
 if(!list.length)h+='<p class="empty">ما كانش طلبيات هنا.</p>';
 list.forEach(function(o){
  h+='<div class="o s-'+esc(o.status)+'"><div class="top"><span class="ref">#'+esc(String(o.id).slice(-6).toUpperCase())+'</span>'+(o.status==='new'?'<span class="new-badge">جديدة</span>':'')+'<span class="when">'+esc(when(o.createdAt))+'</span></div>'
  +'<p class="pr">'+esc(o.product)+' × '+esc(o.qty)+'</p>'
  +'<p class="row"><span>الإسم:</span> '+esc(o.name)+'</p>'
  +'<p class="row"><span>الهاتف:</span> <bdi dir="ltr">'+esc(o.phone)+'</bdi></p>'
  +'<p class="row"><span>الولاية:</span> '+esc(o.wilaya)+'</p>'
  +(o.address?'<p class="row"><span>العنوان:</span> '+esc(o.address)+'</p>':'')
  +(o.note?'<p class="row"><span>ملاحظة:</span> '+esc(o.note)+'</p>':'')
  +'<div class="acts"><a class="call" href="tel:'+esc(String(o.phone).replace(/[^\d+]/g,''))+'">📞 عيّط</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+waNum(o.phone)+'?text='+encodeURIComponent('سلام '+o.name+'، معاك فارماسي الجزائر بخصوص طلبك: '+o.product)+'">واتساب</a>'
  +'<select data-id="'+esc(o.id)+'">'+ST.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===o.status?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></div></div>';
 });
 app.innerHTML=h;
}
app.addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}});
app.addEventListener('change',function(e){var s=e.target.closest('select[data-id]');if(!s)return;var id=s.dataset.id,v=s.value;s.disabled=true;
 api('/api/admin/status',{pin:pin,id:id,status:v}).then(function(d){if(d.ok){all.forEach(function(o){if(o.id===id)o.status=v});render()}else{s.disabled=false;alertBox()}}).catch(function(){s.disabled=false})});
function alertBox(){var m=document.querySelector('.meta');if(m)m.textContent='ما قدرناش نبدلو الحالة. عاود جرب.'}
document.getElementById('rf').onclick=function(){fetchAll(false)};
document.getElementById('lo').onclick=function(){store('fa_pin',null);pin='';login()};
var saved=load('fa_pin');if(saved){pin=saved;fetchAll(true)}else login();
})();
</script>
</body>
</html>
